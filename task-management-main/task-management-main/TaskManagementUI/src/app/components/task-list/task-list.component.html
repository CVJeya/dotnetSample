<div class="container py-3">
  <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-3 mb-4">
    <div>
      <h1 class="h3 mb-1 fw-semibold">Tasks</h1>
      <p class="text-muted mb-0 small">Manage work items with search, updates, and audit metadata.</p>
    </div>
    <a routerLink="/tasks/create" class="btn btn-primary">Create Task</a>
  </div>

  <div class="card shadow-sm border-0 mb-3">
    <div class="card-body">
      <div class="row g-2 align-items-center">
        <div class="col-md-8">
          <label class="form-label small text-muted mb-1">Search</label>
          <input
            type="search"
            class="form-control"
            placeholder="Search title, description, status, or remarks..."
            [(ngModel)]="searchTerm"
            (ngModelChange)="onSearchInput($event)"
            autocomplete="off"
          />
        </div>
        <div class="col-md-4 d-flex align-items-end">
          <button type="button" class="btn btn-outline-secondary w-100" (click)="clearSearch()">
            Clear
          </button>
        </div>
      </div>
    </div>
  </div>

  <app-loading-spinner *ngIf="isLoading" />

  <div *ngIf="!isLoading && tasks.length === 0" class="alert alert-light border text-center py-5">
    <div class="fw-semibold mb-1">No tasks found</div>
    <div class="text-muted small mb-3">Create a task or adjust your search criteria.</div>
    <a routerLink="/tasks/create" class="btn btn-sm btn-primary">Create Task</a>
  </div>

  <div *ngIf="!isLoading && tasks.length > 0" class="card shadow-sm border-0">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th scope="col">Title</th>
            <th scope="col">Status</th>
            <th scope="col">Due Date</th>
            <th scope="col" class="text-end">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let task of tasks; trackBy: trackById">
            <td class="fw-medium">{{ task.taskTitle }}</td>
            <td>
              <span [class]="badgeClass(task.taskStatus)">{{ task.taskStatus }}</span>
            </td>
            <td>{{ task.taskDueDate | date: 'mediumDate' }}</td>
            <td class="text-end">
              <div class="btn-group btn-group-sm" role="group">
                <a class="btn btn-outline-secondary" [routerLink]="['/tasks/details', task.id]">View</a>
                <a class="btn btn-outline-primary" [routerLink]="['/tasks/edit', task.id]">Edit</a>
                <button
                  type="button"
                  class="btn btn-outline-danger"
                  (click)="deleteTask(task)"
                  [disabled]="deletingId === task.id"
                >
                  {{ deletingId === task.id ? 'Deleting...' : 'Delete' }}
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
