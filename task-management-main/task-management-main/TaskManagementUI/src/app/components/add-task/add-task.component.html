<div class="container py-3" style="max-width: 920px">
  <div class="mb-3">
    <a routerLink="/tasks" class="small text-decoration-none text-muted">&larr; Back to tasks</a>
    <h1 class="h3 fw-semibold mt-2">Create Task</h1>
    <p class="text-muted small mb-0">Provide core scheduling details and ownership metadata.</p>
  </div>

  <div class="card shadow-sm border-0">
    <div class="card-body p-4">
      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label">Title <span class="text-danger">*</span></label>
            <input class="form-control" formControlName="taskTitle" placeholder="Short, actionable title" />
            <div class="invalid-feedback d-block" *ngIf="form.controls.taskTitle.touched && form.controls.taskTitle.invalid">
              Title is required (2-200 characters).
            </div>
          </div>

          <div class="col-12">
            <label class="form-label">Description</label>
            <textarea class="form-control" rows="4" formControlName="taskDescription" placeholder="Context and acceptance criteria"></textarea>
          </div>

          <div class="col-md-6">
            <label class="form-label">Due date <span class="text-danger">*</span></label>
            <input type="date" class="form-control" formControlName="taskDueDate" />
            <div class="invalid-feedback d-block" *ngIf="form.controls.taskDueDate.touched && form.controls.taskDueDate.invalid">
              Due date is required.
            </div>
          </div>

          <div class="col-md-6">
            <label class="form-label">Status <span class="text-danger">*</span></label>
            <select class="form-select" formControlName="taskStatus">
              <option *ngFor="let s of statusOptions" [ngValue]="s.value">{{ s.label }}</option>
            </select>
          </div>

          <div class="col-12">
            <label class="form-label">Remarks</label>
            <textarea class="form-control" rows="2" formControlName="taskRemarks" placeholder="Optional notes"></textarea>
          </div>

          <div class="col-md-6">
            <label class="form-label">Created by <span class="text-danger">*</span></label>
            <input class="form-control" formControlName="createdBy" />
            <div class="form-text">Maps to audit column until authentication is introduced.</div>
          </div>
        </div>

        <div class="d-flex justify-content-between mt-4">
          <button type="button" class="btn btn-outline-secondary" (click)="reset()">Reset</button>
          <div class="d-flex gap-2">
            <a routerLink="/tasks" class="btn btn-light border">Cancel</a>
            <button class="btn btn-primary" type="submit" [disabled]="isSubmitting">
              {{ isSubmitting ? 'Saving...' : 'Save Task' }}
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
