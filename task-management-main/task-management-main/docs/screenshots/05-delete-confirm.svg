<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <defs>
    <filter id="blur">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <rect width="960" height="540" fill="#f8f9fa"/>
  <g filter="url(#blur)" opacity="0.5">
    <rect width="960" height="52" fill="#212529"/>
    <rect x="40" y="140" width="880" height="200" fill="#fff" stroke="#dee2e6"/>
  </g>
  <rect width="960" height="540" fill="#000" opacity="0.35"/>
  <rect x="280" y="180" width="400" height="180" rx="10" fill="#fff" stroke="#dee2e6"/>
  <text x="320" y="230" fill="#212529" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">Delete task?</text>
  <text x="320" y="265" fill="#495057" font-family="Segoe UI, Arial, sans-serif" font-size="14">Are you sure you want to delete this task?</text>
  <text x="320" y="288" fill="#6c757d" font-family="Segoe UI, Arial, sans-serif" font-size="13">This action cannot be undone.</text>
  <rect x="320" y="310" width="88" height="38" rx="6" fill="#dc3545"/>
  <text x="342" y="335" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="15">Delete</text>
  <rect x="420" y="310" width="88" height="38" rx="6" fill="#fff" stroke="#ced4da"/>
  <text x="436" y="335" fill="#495057" font-family="Segoe UI, Arial, sans-serif" font-size="15">Cancel</text>
  <text x="280" y="400" fill="#e9ecef" font-family="Segoe UI, Arial, sans-serif" font-size="12">Placeholder  browser confirm may differ; replace with a real capture if required.</text>
</svg>
