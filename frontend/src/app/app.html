<div class="app-layout">
  <nav class="navbar">
    <a routerLink="/" class="navbar-brand">Angular &middot; .NET Demo</a>
    <div class="navbar-links">
      <a routerLink="/users" class="nav-link" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Users</a>
      <a routerLink="/products" class="nav-link" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Products</a>
      @if (isLoggedIn()) {
        <a routerLink="/profile" class="nav-user nav-link" routerLinkActive="active">{{ username() }}</a>
        <a routerLink="/" class="nav-link" (click)="logout()">Logout</a>
      } @else {
        <a routerLink="/login" class="nav-link" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Login</a>
        <a routerLink="/register" class="nav-link" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Register</a>
      }
    </div>
  </nav>

  <main class="main-content">
    <router-outlet />
  </main>
</div>
