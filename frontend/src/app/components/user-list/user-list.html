<div class="container">
  <h1>Users</h1>

  <ng-container *ngIf="users$ | async as users">
    <table *ngIf="users.length > 0" class="table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Email</th>
          <th>Created</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of users">
          <td>{{ user.id }}</td>
          <td>{{ user.name }}</td>
          <td>{{ user.email }}</td>
          <td>{{ user.createdAt | date:'mediumDate' }}</td>
          <td>
            <a [routerLink]="['/users', user.id]" class="btn-edit">Edit</a>
            <button (click)="deleteUser(user.id)" class="btn-delete">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>

    <p *ngIf="users.length === 0" class="text-muted">No users found.</p>
  </ng-container>

  <a routerLink="/users/new" class="btn-primary">Add New User</a>
</div>
