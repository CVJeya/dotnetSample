

networks:
  food-delivery-net:
    driver: bridge

volumes:
  mssql-data:
  rabbitmq-data:
  kafka-data:

services:
  # ─── Infrastructure Services ─────────────────────────────
  sql-server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: food-sql
    networks:
      - food-delivery-net
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "YourStrong!Passw0rd"
      MSSQL_PID: Developer
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "YourStrong!Passw0rd" -C -Q "SELECT 1" || exit 1
      interval: 15s
      timeout: 5s
      retries: 10
  
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: food-rabbitmq
    networks:
      - food-delivery-net
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 15s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: food-kafka
    networks:
      - food-delivery-net
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: "food-delivery-cluster"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: nc -z localhost 9092 || exit 1
      interval: 15s
      timeout: 5s
      retries: 5

  # ─── Application Services ───────────────────────────────
  order-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: food-order-api
    networks:
      - food-delivery-net
    ports:
      - "8080:8080"
      - "5001:5001"   # gRPC
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__Default: "Server=sql-server,1433;Database=FoodDelivery;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: guest
      RabbitMQ__Password: guest
      Kafka__BootstrapServers: "kafka:9092"
    depends_on:
      sql-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  order-consumers:
    build:
      context: .
      dockerfile: Dockerfile.consumers
    
    networks:
      - food-delivery-net
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__Default: "Server=sql-server,1433;Database=FoodDelivery;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: guest
      RabbitMQ__Password: guest
      PartnerApi__Key: "demo-key"
      PartnerApi__BaseUrl: "https://api.delivery-partner.com"
    depends_on:
      sql-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: 2   # Scale consumers for parallel message processing

  # ─── Development Tools (Optional) ────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: food-kafka-ui
    networks:
      - food-delivery-net
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    profiles:
      - dev-only


