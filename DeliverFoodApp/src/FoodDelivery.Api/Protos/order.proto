syntax = "proto3";

option csharp_namespace = "FoodDelivery.Api.Services";

service OrderGrpc {
    rpc GetOrderHistory (OrderHistoryRequest) returns (OrderHistoryResponse);
    rpc GetOrderDetail (OrderDetailRequest) returns (OrderDetailResponse);
}

message OrderHistoryRequest {
    string customer_id = 1;
    int32 limit = 2;
}

message OrderHistoryResponse {
    repeated OrderSummary orders = 1;
}

message OrderSummary {
    string order_id = 1;
    double total_amount = 2;
    string status = 3;
    string created_at = 4;
}

message OrderDetailRequest {
    string order_id = 1;
}

message OrderDetailResponse {
    string order_id = 1;
    string customer_id = 2;
    double total_amount = 3;
    string status = 4;
    repeated OrderItem items = 5;
    string created_at = 6;
    string updated_at = 7;
}

message OrderItem {
    string menu_item_id = 1;
    string name = 2;
    int32 quantity = 3;
    double unit_price = 4;
}
