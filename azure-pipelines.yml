trigger:
  branches:
    include:
      - main
      - master
      - develop

pr:
  branches:
    include:
      - main
      - master

variables:
  dockerRegistryServiceConnection: ''
  # Example: 'yourregistry.azurecr.io'
  containerRegistry: ''
  imageTag: '$(Build.BuildId)'
  system.debug: false

stages:
  - stage: Build
    displayName: Build and Push Docker Images
    jobs:
      - job: Build
        displayName: Build all services
        pool:
          vmImage: ubuntu-latest
        steps:
          # ── Checkout the code ──
          - checkout: self
            fetchDepth: 1

          # ── Login to Azure Container Registry ──
          - task: Docker@2
            displayName: Login to ACR
            inputs:
              command: login
              containerRegistry: $(dockerRegistryServiceConnection)
            condition: ne(variables['dockerRegistryServiceConnection'], '')

          # ── Build and push Backend ──
          - task: Docker@2
            displayName: Build and push Backend
            inputs:
              command: buildAndPush
              repository: dotnet-backend
              dockerfile: backend/AngularDotnetDemo.Api/Dockerfile
              containerRegistry: $(dockerRegistryServiceConnection)
              tags: |
                $(imageTag)
                latest
            condition: succeeded()

          # ── Build and push Angular Frontend ──
          - task: Docker@2
            displayName: Build and push Angular Frontend
            inputs:
              command: buildAndPush
              repository: angular-frontend
              dockerfile: frontend/Dockerfile
              containerRegistry: $(dockerRegistryServiceConnection)
              tags: |
                $(imageTag)
                latest
            condition: succeeded()

          # ── Build and push React Frontend ──
          - task: Docker@2
            displayName: Build and push React Frontend
            inputs:
              command: buildAndPush
              repository: react-frontend
              dockerfile: ReactDotNetDemo/Dockerfile
              containerRegistry: $(dockerRegistryServiceConnection)
              tags: |
                $(imageTag)
                latest
            condition: succeeded()

  # ── Deployment Stage (optional) ──
  - stage: Deploy
    displayName: Deploy to Azure
    dependsOn: Build
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - deployment: DeployToACI
        displayName: Deploy to Azure Container Instances
        pool:
          vmImage: ubuntu-latest
        environment: production
        strategy:
          runOnce:
            deploy:
              steps:
                - script: |
                    echo "Deployment target not configured."
                    echo "To deploy, use one of these options:"
                    echo ""
                    echo "  Option A - Azure Container Instances (ACI):"
                    echo "    az container create -g MyResourceGroup --name dotnet-backend "
                    echo "      --image $(containerRegistry)/dotnet-backend:$(imageTag) --ports 8080"
                    echo ""
                    echo "  Option B - Azure App Service:"
                    echo "    az webapp create -g MyResourceGroup -p MyPlan -n myapp-backend"
                    echo "    az webapp config container set -n myapp-backend"
                    echo "      --docker-custom-image-name $(containerRegistry)/dotnet-backend:$(imageTag)"
                    echo ""
                    echo "  Option C - Azure Kubernetes Service (AKS):"
                    echo "    kubectl apply -f k8s/deployment.yaml"
                  displayName: Show deployment instructions
                - script: |
                    echo "##vso[task.setvariable variable=ACR_NAME]$(containerRegistry)"
                    echo "##vso[task.setvariable variable=IMAGE_TAG]$(imageTag)"
                  displayName: Export deployment variables
